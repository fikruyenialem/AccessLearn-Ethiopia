version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: accesslearn_backend
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=docker_production_ready_secret_key_accesslearn_2026
      - ENVIRONMENT=development
      - DATABASE_URL=sqlite:///./accesslearn.db
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: accesslearn_frontend
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
